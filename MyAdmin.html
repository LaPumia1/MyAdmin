<title>MyAdmin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F3F6;--surface:#fff;--s2:#F4F5F8;--ink:#0B1220;--mut:#667085;--line:#E3E6EC;--brand:#B8924A;--onbrand:#1A1405;--gold-d:#8A6A2C;--acc:#C9A24E;--onacc:#1A1405;--inc:#1F8F76;--exp:#BE4560;--hero:#0E1A33;--shadow:0 8px 28px rgba(11,18,32,.08)}
html[data-theme=dark]{--bg:#070B14;--surface:#0F1626;--s2:#162036;--ink:#EDEFF5;--mut:#8F99B0;--line:#1F2A42;--brand:#D9B872;--onbrand:#1A1405;--gold-d:#E3C98B;--acc:#D9B872;--onacc:#1A1405;--inc:#3CC9A7;--exp:#F0728B;--hero:#12214A;--shadow:0 8px 28px rgba(0,0,0,.45)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input,select,textarea{font:inherit;color:var(--ink)}
h1,h2,h3,.disp{font-family:'Manrope',system-ui,sans-serif;letter-spacing:-.02em;margin:0}
.num{font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding:18px 16px 170px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.top h1{font-size:26px;font-weight:800}
.top small{display:block;color:var(--mut);font-size:13px}
.av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#E6CD93,#B8924A);color:var(--onacc);display:grid;place-items:center;font:800 18px 'Manrope',sans-serif;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.mnav{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:999px;padding:6px;margin-bottom:14px;box-shadow:var(--shadow)}
.mnav b{font:700 16px 'Manrope',sans-serif}
svg.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.row>svg.ic{width:30px;height:30px;padding:6px;border-radius:10px 10px 10px 4px;background:var(--s2);color:var(--gold-d);stroke-width:2.2}
.pix{display:block;font-size:13.5px;word-break:break-all;margin-top:4px;letter-spacing:.01em}
a.btn{text-decoration:none}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--s2)}
.ib svg,.ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.hero{position:relative;color:#fff;border-radius:26px 26px 26px 6px;padding:20px 20px 16px 58px;margin-bottom:14px;overflow:hidden;background:repeating-linear-gradient(to bottom,transparent 0 27px,rgba(217,184,114,.10) 27px 28px),linear-gradient(160deg,var(--hero),#070D1D);border:1px solid rgba(217,184,114,.22)}
.hero::before{content:"";position:absolute;left:40px;top:0;bottom:0;width:2px;background:rgba(217,184,114,.55)}
.hero small{color:rgba(255,255,255,.7);font-size:13px}
.hero .big{font:800 38px/1.1 'Manrope',sans-serif;letter-spacing:-.03em;margin:2px 0 10px}
.hrow{display:flex;gap:22px;margin-bottom:8px}
.hrow b{display:block;font-size:15px}
.hero svg.chart{width:100%;height:auto;display:block;margin-top:4px}
.axis{display:flex;justify-content:space-between;font-size:11px;color:rgba(255,255,255,.6)}
.card{background:var(--surface);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.ch{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.ch h3{font-size:17px;font-weight:700}
.lnk{color:var(--gold-d);font-weight:600;font-size:14px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:14px 8px;color:var(--mut)}
.eico{width:60px;height:60px;border-radius:20px 20px 20px 6px;background:var(--s2);display:grid;place-items:center;font-size:28px}

/* ============ utilidades ============ */

function effects(t){
 if(t.cardId&&!t.invoicePay)return [];
 if(t.type==='inc')return [[t.accountId,t.amount]];
 if(t.type==='exp')return [[t.accountId,-t.amount]];

function openInvoices(){

 S.cards.forEach(c=>{
  const yms=new Set(S.tx.filter(t=>t.cardId===c.id&&!t.invoicePay).map(t=>invYm(c,t)));
  yms.forEach(ym=>{if(!invPaid(c,ym)){const total=invTotal(c,ym);if(total>0.004)out.push({card:c,ym,total,due:invDue(c,ym)})}});
 });
 return invCache=out.sort((a,b)=>a.due<b.due?-1:1);
}

function totalAt(d,proj){
 let b=S.accounts.reduce((s,a)=>s+(a.initial||0),0);
 const T=todayStr(),ids=new Set(S.accounts.map(a=>a.id));
 S.tx.forEach(t=>{
  const cnt=(t.paid&&t.date<=d)||(proj&&!t.paid&&d>=T&&t.date<=d);
  if(cnt)effects(t).forEach(([id,dl])=>{if(ids.has(id))b+=dl});
 });
 if(proj&&d>=T)openInvoices().forEach(i=>{if(i.due<=d)b-=i.total});
 return b;
}
function accBal(a,upTo){
 let b=a.initial||0;
 S.tx.forEach(t=>{if(t.paid&&t.date<=upTo)effects(t).forEach(([id,d])=>{if(id===a.id)b+=d})});
 return b;
}
function accStats(a,ym){

 const st={start:accBal(a,prevEnd),end:accBal(a,mE),inc:0,exp:0,ren:0,tra:0};
 S.tx.forEach(t=>{
  if(!t.paid||!t.date.startsWith(ym))return;
  effects(t).forEach(([id,d])=>{
   if(id!==a.id)return;
   if(t.type==='tra')st.tra+=d;
   else if(d>0){t.catId==='i_ren'?st.ren+=d:st.inc+=d}
   else st.exp+=-d;
  });
 });
 return st;
}

function chartSvg(vals,ti){
 const W=320,H=84,p=8,n=vals.length;let mn=Math.min(...vals),mx=Math.max(...vals);if(mx-mn<1){mx+=1;mn-=1}
 const X=i=>p+i/(n-1)*(W-2*p),Y=v=>H-p-(v-mn)/(mx-mn)*(H-2*p);
 const path=(a,b)=>{let s='';for(let i=a;i<=b;i++)s+=(i===a?'M':'L')+X(i).toFixed(1)+' '+Y(vals[i]).toFixed(1);return s};
 let h='';
 if(ti<0)h=`<path d="${path(0,n-1)}" fill="none" stroke="#E3C98B" stroke-width="2" stroke-dasharray="5 5" stroke-linecap="round"/>`;
 else{h=`<path d="${path(0,ti)}" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  if(ti<n-1)h+=`<path d="${path(ti,n-1)}" fill="none" stroke="#E3C98B" stroke-width="2" stroke-dasharray="5 5" stroke-linecap="round"/>`;
  h+=`<circle cx="${X(ti)}" cy="${Y(vals[ti])}" r="5" fill="#E3C98B" stroke="#0E1A33" stroke-width="2"/>`}
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução do saldo no mês">${h}</svg>`;
}

function longestStreak(){
 const ds=[...new Set(S.tx.map(t=>t.date))].sort();let best=0,cur=0,prev=null;
 ds.forEach(d=>{if(prev){const a=new Date(prev+'T00:00'),b=new Date(d+'T00:00');cur=Math.round((b-a)/864e5)===1?cur+1:1}else cur=1;best=Math.max(best,cur);prev=d});
 return best;
}

function sSave(){
 const ym=ui.ym,T=ymOf(todayStr()),mt=monthTx(ym),prev=monthTx(addM(ym,-1)),tips=[];
 const inc=mt.filter(t=>t.type==='inc').reduce((s,t)=>s+t.amount,0),exp=mt.filter(t=>t.type==='exp').reduce((s,t)=>s+t.amount,0);
 if(inc>0){const r=(inc-exp)/inc*100;tips.push(r>=20?['💚',`Você guardou ${Math.round(r)}% da renda em ${monthOnly(ym)}. Está acima dos 20% que muitos planejadores recomendam.`]:r>=0?['🌤️',`Você guardou ${Math.round(r)}% da renda. Chegar a 20% pede cortar cerca de ${fmt(Math.max(0,inc*.2-(inc-exp)))} em despesas.`]:['⚠️',`As despesas passaram das receitas em ${fmt(exp-inc)} neste mês. Comece revisando as maiores categorias.`])}
 const cs=byCat(mt);
 if(cs[0]&&exp>0)tips.push(['🔎',`${cs[0].c.e} ${cs[0].c.n} é seu maior gasto: ${fmt(cs[0].v)}, ${Math.round(cs[0].v/exp*100)}% das despesas.`]);
 const pc=byCat(prev);
 cs.forEach(c=>{const p=pc.find(x=>x.id===c.id);if(p&&p.v>0&&c.v>p.v*1.2&&c.v-p.v>20)tips.push(['📈',`${c.c.n} subiu ${Math.round((c.v/p.v-1)*100)}% em relação a ${monthOnly(addM(ym,-1))} (${fmt(c.v-p.v)} a mais).`])});
 const ass=mt.filter(t=>t.type==='exp'&&t.catId==='e_ass').reduce((s,t)=>s+t.amount,0);
 if(ass>0)tips.push(['🔁',`Assinaturas somam ${fmt(ass)} no mês, ${fmt(ass*12)} no ano. Vale cancelar o que você não usa.`]);
 Object.keys(S.budgets).forEach(id=>{const c=catOf(id),s=(cs.find(x=>x.id===id)||{v:0}).v;if(c&&s>S.budgets[id])tips.push(['🚨',`${c.n} passou do limite em ${fmt(s-S.budgets[id])}.`])});
 openInvoices().filter(i=>i.due<todayStr()).forEach(i=>tips.push(['💳',`A fatura ${i.card.name} de ${fmt(i.total)} está vencida. Juros do rotativo costumam ser os mais caros que existem.`]));
 return subWrap('Economizar',monthNav()+(tips.length?'<div class="tgrid">'+tips.map(t=>`<div class="card" style="display:flex;gap:12px"><span class="em">${t[0]}</span><p style="margin:0">${esc(t[1])}</p></div>`).join('')+'</div>':`<div class="card">${emptyBox('💡','Registre receitas e despesas deste mês para ver onde dá para economizar.')}</div>`));

function txOpen(id,pre={}){
 if(!S.accounts.length){toast('Crie uma conta antes de lançar');ui.tab='accounts';ui.sub=null;render();setTimeout(()=>ACT['acc-new'](),50);return}
 const t=id?S.tx.find(x=>x.id===id):null;
 if(t&&t.invoicePay){ask('Pagamento de fatura','Este lançamento paga uma fatura. Desfazer o pagamento reabre a fatura.','Desfazer pagamento',()=>{deleteTx(t.id);save();render();toast('Pagamento desfeito')});return}
 D=t?{id:t.id,type:t.type,amountStr:numStr(t.amount),desc:t.desc||'',date:t.date,catId:t.catId||'',accountId:t.accountId||S.accounts[0].id,toAccountId:t.toAccountId||'',method:t.cardId?'card':'acc',cardId:t.cardId||(S.cards[0]||{}).id,paid:t.paid,inst:1,touched:true}
  :{type:'exp',amountStr:'',desc:'',date:pre.date||todayStr(),catId:'',accountId:S.accounts[0].id,toAccountId:(S.accounts[1]||{}).id||'',method:pre.card?'card':'acc',cardId:pre.card||(S.cards[0]||{}).id,paid:(pre.date||todayStr())<=todayStr(),inst:1,touched:false};
 D._onbind=k=>{if(k==='date'&&!D.touched){D.paid=D.date<=todayStr();const c=$('#f_paid');if(c)c.checked=D.paid}if(k==='paid')D.touched=true};
 openSheet(t?'Editar lançamento':'Novo lançamento','');drawTx();
 if(!t)setTimeout(()=>{const a=$('#sheet .amt input');a&&a.focus()},250);
}
function drawTx(){
 const hasCards=S.cards.length>0,isCard=D.type==='exp'&&D.method==='card'&&hasCards;
 let h=`<div class="seg">${[['exp','Despesa'],['inc','Receita'],['tra','Transferência']].map(([k,l])=>`<button class="${D.type===k?'on '+k:''}" data-a="txtype" data-id="${k}">${l}</button>`).join('')}</div>
 <label class="amt"><span>Valor</span><input data-bind="amountStr" value="${esc(D.amountStr)}" inputmode="decimal" placeholder="0,00" autocomplete="off"></label>`;
 if(D.type!=='tra'){

 }
 if(D.type==='exp'&&hasCards)h+=`<div class="seg"><button class="${D.method==='acc'?'on':''}" data-a="txmethod" data-id="acc">Pago da conta</button><button class="${D.method==='card'?'on':''}" data-a="txmethod" data-id="card">No cartão</button></div>`;
 if(isCard)h+=`<label class="f" style="margin-top:12px"><span>Cartão</span><select data-bind="cardId">${opts(S.cards,D.cardId)}</select></label>`;
 else if(D.type==='tra')h+=`<label class="f" style="margin-top:12px"><span>De</span><select data-bind="accountId">${opts(S.accounts,D.accountId)}</select></label><label class="f"><span>Para</span><select data-bind="toAccountId">${opts(S.accounts,D.toAccountId,'Escolha a conta')}</select></label>`;
 else h+=`<label class="f" style="margin-top:12px"><span>${D.type==='inc'?'Entra na conta':'Sai da conta'}</span><select data-bind="accountId">${opts(S.accounts,D.accountId)}</select></label>`;
 h+=`<label class="f"><span>${isCard?'Data da compra':'Data'}</span><input type="date" data-bind="date" value="${D.date}"></label>`;
 if(isCard&&!D.id)h+=`<label class="f"><span>Parcelas</span><input type="number" min="1" max="48" data-bind="inst" value="${D.inst}"></label>`;
 if(!isCard)h+=`<label class="chk"><input type="checkbox" id="f_paid" data-bind="paid" ${D.paid?'checked':''}>${D.type==='inc'?'Já foi recebido':D.type==='tra'?'Já foi realizada':'Já foi pago'}</label>`;
 h+=`<div class="btns">${D.id?`<button class="btn del" data-a="tx-del">Excluir</button>`:''}<button class="btn" data-a="tx-save">Salvar</button></div>`;

function saveTx(){
 const amt=parseMoney(D.amountStr);
 if(!(amt>0))return toast('Informe um valor maior que zero');
 if(!D.date)return toast('Escolha a data');
 const isCard=D.type==='exp'&&D.method==='card'&&S.cards.length>0;
 if(D.type==='tra'&&(!D.toAccountId||D.toAccountId===D.accountId))return toast('Escolha duas contas diferentes');
 if(!isCard&&!accOf(D.accountId))return toast('Escolha a conta');
 const catId=D.type==='tra'?'':(D.catId||(D.type==='inc'?'i_out':'e_out'));
 const desc=D.desc.trim()||(D.type==='tra'?'Transferência':(catOf(catId)||{}).n||'');
 const base={type:D.type,catId,accountId:isCard?((cardOf(D.cardId)||{}).accountId||S.accounts[0].id):D.accountId,toAccountId:D.type==='tra'?D.toAccountId:'',cardId:isCard?D.cardId:'',paid:isCard?true:!!D.paid};
 if(D.id){const t=S.tx.find(x=>x.id===D.id);Object.assign(t,base,{amount:amt,desc,date:D.date})}
 else{
  const n=isCard?Math.max(1,Math.min(48,parseInt(D.inst)||1)):1;
  const cents=Math.round(amt*100),part=Math.floor(cents/n);
  for(let i=0;i<n;i++){const v=(i===n-1?cents-part*(n-1):part)/100;S.tx.push({id:uid(),...base,amount:v,desc:n>1?`${desc} (${i+1}/${n})`:desc,date:addMonthsDate(D.date,i)})}
 }
 save();closeSheet();render();toast('Lançamento salvo');
}

 D=g?{id:g.id,name:g.name,targetStr:numStr(g.target),deadline:g.deadline,accountId:g.accountId||'',savedStr:''}:{name:'',targetStr:'',deadline:addMonthsDate(todayStr(),12),accountId:'',savedStr:''};
 openSheet(g?'Editar meta':'Nova meta','');
 setBody(`<label class="f"><span>Nome da meta</span><input data-bind="name" value="${esc(D.name)}" placeholder="Ex.: Viagem de férias" maxlength="40"></label><label class="f"><span>Valor da meta</span><input data-bind="targetStr" inputmode="decimal" value="${esc(D.targetStr)}" placeholder="0,00"></label><label class="f"><span>Prazo</span><input type="date" data-bind="deadline" value="${D.deadline}"></label><label class="f"><span>Conta vinculada</span><select data-bind="accountId">${opts(S.accounts,D.accountId,'Nenhuma')}</select></label>${g?'':`<label class="f"><span>Já guardado (opcional)</span><input data-bind="savedStr" inputmode="decimal" placeholder="0,00"></label>`}<div class="btns">${g?`<button class="btn del" data-a="goal-del">Excluir</button>`:''}<button class="btn" data-a="goal-save">Salvar</button></div>`);
}

/* ============ ações ============ */
const ACT={
 close:closeSheet,
 askyes(){const f=askFn;closeSheet();f&&f()},
 nav(el){ui.tab=el.dataset.id;ui.sub=null;render();window.scrollTo(0,0)},
 sub(el){ui.sub=el.dataset.id;flag('v_'+ui.sub);render();window.scrollTo(0,0);if(ui.sub==='quotes'&&!S.rates)loadRates()},
 back(){ui.sub=null;render();window.scrollTo(0,0)},
 mon(el){ui.ym=addM(ui.ym,+el.dataset.id);render()},
 'card-sel'(el){ui.cardId=el.dataset.id;render()},
 calday(el){ui.calDay=el.dataset.id;render()},
 'add-tx'(el){txOpen(null,{date:el.dataset.date,card:el.dataset.card})},
 'tx-edit'(el){txOpen(el.dataset.id)},
 txtype(el){D.type=el.dataset.id;D.catId='';if(D.type!=='exp')D.method='acc';drawTx()},
 txcat(el){D.catId=el.dataset.id;if(!D.desc){/* mantém vazio: usa nome da categoria */}drawTx()},
 txmethod(el){D.method=el.dataset.id;drawTx()},
 'tx-save':saveTx,
 'tx-del'(){const id=D.id;ask('Excluir lançamento','Esta ação não pode ser desfeita.','Excluir',()=>{deleteTx(id);save();render();toast('Lançamento excluído')})},
 settle(el){const t=S.tx.find(x=>x.id===el.dataset.id);if(t){t.paid=true;save();render();toast(t.type==='inc'?'Recebido':'Pago')}},
 /* contas */
 'acc-new'(){accOpen()},'acc-edit'(el){accOpen(el.dataset.id)},
 'acc-color'(el){D.color=el.dataset.id;drawAcc()},
 'acc-save'(){
  if(!D.name.trim())return toast('Dê um nome à conta');
  const o={name:D.name.trim(),type:D.type,color:D.color,initial:parseMoney(D.initialStr)};
  if(D.id)Object.assign(accOf(D.id),o);else S.accounts.push({id:uid(),...o});
  save();closeSheet();render();toast('Conta salva');
 },
 'acc-move'(el){const i=S.accounts.findIndex(a=>a.id===D.id),j=i+ +el.dataset.id;if(j<0||j>=S.accounts.length)return;[S.accounts[i],S.accounts[j]]=[S.accounts[j],S.accounts[i]];save();render();toast('Ordem atualizada')},
 'acc-del'(){const id=D.id;ask('Excluir conta','Todos os lançamentos desta conta também serão apagados.','Excluir',()=>{
  S.tx=S.tx.filter(t=>t.accountId!==id&&t.toAccountId!==id);S.accounts=S.accounts.filter(a=>a.id!==id);
  S.cards.forEach(c=>{if(c.accountId===id)c.accountId=(S.accounts[0]||{}).id});S.goals.forEach(g=>{if(g.accountId===id)g.accountId=''});
  save();render();toast('Conta excluída')})},
 /* cartões */
 'card-new'(){if(!S.accounts.length){toast('Crie uma conta primeiro');return}cardOpen()},'card-edit'(el){cardOpen(el.dataset.id)},
 'card-color'(el){D.color=el.dataset.id;drawCard()},
 'card-save'(){
  if(!D.name.trim())return toast('Dê um nome ao cartão');
  const cl=Math.max(1,Math.min(31,parseInt(D.closeDay)||1)),du=Math.max(1,Math.min(31,parseInt(D.dueDay)||1));
  const o={name:D.name.trim(),limit:parseMoney(D.limitStr),closeDay:cl,dueDay:du,accountId:D.accountId,color:D.color};
  if(D.id)Object.assign(cardOf(D.id),o);else{const c={id:uid(),...o};S.cards.push(c);ui.cardId=c.id}
  save();closeSheet();render();toast('Cartão salvo');
 },
 'card-del'(){const id=D.id;ask('Excluir cartão','As compras deste cartão também serão apagadas.','Excluir',()=>{
  S.tx=S.tx.filter(t=>t.cardId!==id);Object.keys(S.paidInv).forEach(k=>{if(k.startsWith(id+'|'))delete S.paidInv[k]});S.cards=S.cards.filter(c=>c.id!==id);ui.cardId=null;save();render();toast('Cartão excluído')})},
 payinv(el){
  const c=cardOf(el.dataset.id),ym=el.dataset.ym,total=invTotal(c,ym);
  D={cardId:c.id,ym,accountId:c.accountId||S.accounts[0].id,date:todayStr()};
  openSheet('Pagar fatura',`<div class="tile" style="margin-bottom:12px"><small>Fatura ${esc(c.name)} de ${monthOnly(ym)}</small><b class="num" style="font-size:24px">${fmt(total)}</b></div><label class="f"><span>Pagar com a conta</span><select data-bind="accountId">${opts(S.accounts,D.accountId)}</select></label><label class="f"><span>Data do pagamento</span><input type="date" data-bind="date" value="${D.date}"></label><button class="btn" data-a="payinv-ok">Confirmar pagamento</button>`);
 },
 'payinv-ok'(){
  const c=cardOf(D.cardId),id=uid();
  S.tx.push({id,type:'exp',desc:`Fatura ${c.name}`,amount:invTotal(c,D.ym),date:D.date,catId:'',accountId:D.accountId,toAccountId:'',cardId:c.id,invoicePay:true,paid:true});
  S.paidInv[invKey(c,D.ym)]=id;save();closeSheet();render();toast('Fatura paga');
 },
 unpay(el){const c=cardOf(el.dataset.id),k=invKey(c,el.dataset.ym),id=S.paidInv[k];ask('Desfazer pagamento','A fatura volta a ficar aberta e o valor retorna para a conta.','Desfazer',()=>{deleteTx(id);delete S.paidInv[k];save();render();toast('Pagamento desfeito')})},
 /* metas */
 'goal-new'(){goalOpen()},'goal-edit'(el){goalOpen(el.dataset.id)},
 'goal-save'(){
  const tg=parseMoney(D.targetStr);
  if(!D.name.trim())return toast('Dê um nome à meta');
  if(!(tg>0))return toast('Informe o valor da meta');
  if(!D.deadline)return toast('Escolha o prazo');
  if(D.id){Object.assign(S.goals.find(g=>g.id===D.id),{name:D.name.trim(),target:tg,deadline:D.deadline,accountId:D.accountId})}
  else{const s=parseMoney(D.savedStr);S.goals.push({id:uid(),name:D.name.trim(),target:tg,deadline:D.deadline,accountId:D.accountId,deposits:s>0?[{id:uid(),date:todayStr(),amount:s}]:[]})}
  save();closeSheet();render();toast('Meta salva');
 },
 'goal-del'(){const id=D.id;ask('Excluir meta','O histórico de valores guardados será apagado.','Excluir',()=>{S.goals=S.goals.filter(g=>g.id!==id);save();render()})},
 'goal-dep'(el){
  D={id:el.dataset.id,mode:1,amountStr:''};D._onbind=null;
  openSheet('Guardar valor','');drawDep();
 },
 depmode(el){D.mode=+el.dataset.id;drawDep()},
 'dep-ok'(){
  const v=parseMoney(D.amountStr);if(!(v>0))return toast('Informe um valor');
  const g=S.goals.find(x=>x.id===D.id);g.deposits.push({id:uid(),date:todayStr(),amount:v*D.mode});
  save();closeSheet();render();toast(D.mode>0?'Valor guardado':'Valor retirado');
 },
 /* mais */
 profile(){
  D={name:S.profile.name,photo:S.profile.photo};openSheet('Seu perfil','');drawProfile();
 },
 'ph-clear'(){D.photo='';drawProfile()},
 'profile-save'(){if(!D.name.trim())return toast('Informe seu nome');S.profile.name=D.name.trim();S.profile.photo=D.photo;save();closeSheet();render()},
 'pick-theme'(){openSheet('Tema',[['auto','Automático (segue o aparelho)'],['light','Claro'],['dark','Escuro']].map(([k,l])=>`<button class="row" data-a="set-theme" data-id="${k}"><span class="t"><b>${l}</b></span>${S.theme===k?'✓':''}</button>`).join(''))},
 'set-theme'(el){S.theme=el.dataset.id;save();closeSheet();render()},
 'pick-cur'(){openSheet('Moeda',['BRL','USD','EUR','GBP'].map(k=>`<button class="row" data-a="set-cur" data-id="${k}"><span class="t"><b>${k}</b></span>${S.currency===k?'✓':''}</button>`).join(''))},
 'set-cur'(el){S.currency=el.dataset.id;save();closeSheet();render()},
 'home-custom'(){
  const L={summary:'Resumo do mês',today:'Hoje',pending:'Pendentes',cats:'Gastos por categoria',recent:'Últimos lançamentos'};
  openSheet('Tela inicial',Object.keys(L).map(k=>`<label class="chk"><input type="checkbox" ${S.home[k]?'checked':''} data-a="home-toggle" data-id="${k}">${L[k]}</label>`).join(''));
 },
 'home-toggle'(el){S.home[el.dataset.id]=el.checked;save();render()},
 budget(el){
  const c=catOf(el.dataset.id);D={id:c.id,amountStr:S.budgets[c.id]?numStr(S.budgets[c.id]):''};
  openSheet('Limite: '+c.n,`<label class="amt"><span>Limite mensal</span><input data-bind="amountStr" value="${esc(D.amountStr)}" inputmode="decimal" placeholder="0,00"></label><div class="btns"><button class="btn ghost" data-a="budget-clear">Remover limite</button><button class="btn" data-a="budget-ok">Salvar</button></div>`);
 },
 'budget-ok'(){const v=parseMoney(D.amountStr);if(v>0)S.budgets[D.id]=v;else delete S.budgets[D.id];save();closeSheet();render()},
 'budget-clear'(){delete S.budgets[D.id];save();closeSheet();render()},
 'cat-new'(){D={name:'',emoji:'🏷',t:'exp'};openSheet('Nova categoria','');drawCat()},
 cattype(el){D.t=el.dataset.id;drawCat()},
 'cat-ico'(el){D.emoji=PICK[+el.dataset.id];drawCat()},
 'cat-ok'(){if(!D.name.trim())return toast('Dê um nome à categoria');S.cats.push({id:'c_'+uid(),n:D.name.trim(),e:D.emoji||'🏷',t:D.t,custom:true});save();closeSheet();render()},
 'cat-del'(el){const id=el.dataset.id;ask('Excluir categoria','Lançamentos dela passam para "Outros".','Excluir',()=>{S.tx.forEach(t=>{if(t.catId===id)t.catId=t.type==='inc'?'i_out':'e_out'});delete S.budgets[id];S.cats=S.cats.filter(c=>c.id!==id);save();render()})},
 rates(){loadRates()},
 async 'copy-pix'(){
  const k='3d198a68-38d3-4899-8a86-f03da4111309';
  try{await navigator.clipboard.writeText(k);toast('Chave Pix copiada. Obrigado pelo apoio!')}
  catch(e){try{const r=document.createRange();r.selectNodeContents($('#pixKey'));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);document.execCommand('copy');toast('Chave Pix copiada. Obrigado pelo apoio!')}catch(e2){toast('Selecione e copie a chave manualmente')}}
 },
 backup(){
  openSheet('Backup e restauração',`<p class="mut" style="margin-top:0">O arquivo contém todos os seus dados. Guarde em local seguro.</p><button class="btn" data-a="export">Baixar backup</button><button class="btn ghost" style="margin-top:10px" data-a="copy">Copiar dados</button><div class="f" style="margin-top:18px"><span>Restaurar de um arquivo</span><input type="file" accept=".json,application/json" data-file="import"></div><div class="f"><span>Ou cole os dados aqui</span><textarea id="pasteData" placeholder="Cole o conteúdo do backup"></textarea></div><button class="btn ghost" data-a="import-paste">Restaurar dados colados</button>`);
 },
 export(){
  flag('backup');
  const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=`myadmin-backup-${todayStr()}.json`;document.body.appendChild(a);a.click();a.remove();toast('Backup gerado');
 },
 async copy(){flag('backup');try{await navigator.clipboard.writeText(JSON.stringify(S));toast('Dados copiados')}catch(e){toast('Não foi possível copiar')}},
 'import-paste'(){importData($('#pasteData').value)},
 'reset-fin'(){ask('Começar do zero','Apaga lançamentos, contas, cartões, metas e limites. Seu perfil e tema continuam.','Apagar dados',()=>{const p=S.profile,th=S.theme,cu=S.currency,hm=S.home,cats=S.cats.filter(c=>c.custom);S=blank();S.profile=p;S.theme=th;S.currency=cu;S.home=hm;S.cats=[...S.cats,...cats];save();render();toast('Tudo limpo')})},
 'reset-all'(){ask('Apagar tudo','Remove todos os dados deste aparelho, inclusive seu perfil. Não dá para desfazer.','Apagar tudo',()=>{S=blank();ui={tab:'home',ym:ymOf(todayStr()),sub:null,cardId:null,calDay:todayStr()};store.save();render()})},
 'ob-go'(){
  const n=$('#obName').value.trim();if(!n){$('#obName').focus();return toast('Como podemos te chamar?')}
  S.profile={name:n,photo:tmpPhoto,done:true};
  S.accounts.push({id:uid(),name:'Carteira',type:'Carteira',color:ACC_COLORS[0],initial:0});
  save();render();
 }
};
function drawDep(){
 setBody(`<div class="seg"><button class="${D.mode>0?'on':''}" data-a="depmode" data-id="1">Guardar</button><button class="${D.mode<0?'on':''}" data-a="depmode" data-id="-1">Retirar</button></div><label class="amt"><span>Valor</span><input data-bind="amountStr" value="${esc(D.amountStr)}" inputmode="decimal" placeholder="0,00"></label><button class="btn" data-a="dep-ok">Confirmar</button>`);
}
function drawProfile(){
 setBody(`<label class="phbtn" for="pfPhoto" style="cursor:pointer;margin-bottom:12px">${D.photo?`<img src="${D.photo}" alt="Sua foto">`:'Foto<br>(opcional)'}</label><input id="pfPhoto" type="file" accept="image/*" data-file="photo-edit" hidden>${D.photo?`<button class="lnk" style="display:block;margin:0 auto 12px" data-a="ph-clear">Remover foto</button>`:''}<label class="f"><span>Nome</span><input data-bind="name" value="${esc(D.name)}" maxlength="30"></label><button class="btn" data-a="profile-save">Salvar</button>`);
}
function drawCat(){
 setBody(`<div class="seg"><button class="${D.t==='exp'?'on exp':''}" data-a="cattype" data-id="exp">Despesa</button><button class="${D.t==='inc'?'on inc':''}" data-a="cattype" data-id="inc">Receita</button></div><label class="f" style="margin-top:12px"><span>Nome</span><input data-bind="name" value="${esc(D.name)}" maxlength="24" placeholder="Ex.: Pets"></label><div class="f"><span>Ícone</span><div class="chips">${PICK.map((e,i)=>`<button class="chip ${D.emoji===e?'on':''}" data-a="cat-ico" data-id="${i}" aria-label="Ícone ${i+1}">${e}</button>`).join('')}</div></div><button class="btn" data-a="cat-ok">Criar categoria</button>`);
}
function importData(txt){
 try{const d=JSON.parse(txt);if(!d||!Array.isArray(d.accounts)||!Array.isArray(d.tx))throw 0;
  ask('Restaurar backup','Os dados atuais serão substituídos pelos do backup.','Restaurar',()=>{adopt(d);S.profile.done=true;save();render();toast('Backup restaurado')});
 }catch(e){toast('Arquivo de backup inválido')}
}
async function loadRates(){
 ratesErr=false;
 try{
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),7000);
  const r=await fetch('https://economia.awesomeapi.com.br/json/last/USD-BRL,EUR-BRL,GBP-BRL,BTC-BRL',{signal:ctl.signal});clearTimeout(to);
  const j=await r.json(),rates={};
  ['USD','EUR','GBP','BTC'].forEach(k=>{const o=j[k+'BRL'];if(o)rates[k]={v:+o.bid,p:+o.pctChange}});
  if(!Object.keys(rates).length)throw 0;
  S.rates={at:Date.now(),r:rates};save();
 }catch(e){ratesErr=true}
 if(ui.sub==='quotes')render();
}

/* ============ eventos ============ */
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-a]');if(!el)return;
 if(el.tagName==='INPUT'&&el.type==='checkbox'){return}
 const f=ACT[el.dataset.a];if(f)f(el,e);
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.dataset&&el.dataset.a==='home-toggle'){ACT['home-toggle'](el);return}
 if(el.dataset&&el.dataset.file){
  const file=el.files&&el.files[0];if(!file)return;
  if(el.dataset.file==='import'){const r=new FileReader();r.onload=()=>importData(r.result);r.readAsText(file);return}
  pickPhoto(file,url=>{
   if(el.dataset.file==='photo'){tmpPhoto=url;const p=$('#obPh');p.innerHTML=`<img src="${url}" alt="Sua foto">`}
   else{D.photo=url;drawProfile()}
  });return;
 }
});
function onBind(e){
 const t=e.target;if(!t.dataset||!t.dataset.bind||!D)return;
 D[t.dataset.bind]=t.type==='checkbox'?t.checked:t.value;
 if(D._onbind)D._onbind(t.dataset.bind);
}
document.addEventListener('input',onBind);
document.addEventListener('change',onBind);
document.addEventListener('input',e=>{if(e.target.id==='cvAmt')updateConv()});
document.addEventListener('change',e=>{if(e.target.id==='cvCur')updateConv()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sheet').innerHTML)closeSheet()});
function pickPhoto(file,cb){
 const r=new FileReader();
 r.onload=()=>{const img=new Image();img.onload=()=>{const s=200,c=document.createElement('canvas');c.width=c.height=s;const m=Math.min(img.width,img.height);c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);cb(c.toDataURL('image/jpeg',.82))};img.src=r.result};
 r.readAsDataURL(file);
}
matchMedia('(prefers-color-scheme: dark)').addEventListener&&matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);

/* ============ início ============ */
(async()=>{
 const d=await store.load();
 if(d)adopt(d);
 render();
 setTimeout(()=>{const sp=$('#splash');sp&&sp.remove()},3500);
})();
</script>
